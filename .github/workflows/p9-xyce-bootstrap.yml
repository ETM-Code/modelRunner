name: P9 Xyce bootstrap

on:
  push:
    branches:
      - p9-xyce-public-runner
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Confirm runner and pin ADMS archive
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          git ls-remote https://github.com/Qucs/ADMS.git \
            refs/tags/release-2.3.7 \
            'refs/tags/release-2.3.7^{}'
          curl -fL --retry 5 \
            -o /tmp/adms.tar.gz \
            https://codeload.github.com/Qucs/ADMS/tar.gz/refs/tags/release-2.3.7
          sha256sum /tmp/adms.tar.gz
          tar -tzf /tmp/adms.tar.gz | head -n 3
