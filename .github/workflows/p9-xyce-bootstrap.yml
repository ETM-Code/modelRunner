name: P9 Xyce bootstrap

on:
  push:
    branches:
      - p9-xyce-public-runner
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and hash source archives
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          git ls-remote https://github.com/Qucs/ADMS.git \
            refs/tags/release-2.3.7 \
            'refs/tags/release-2.3.7^{}'
          git ls-remote https://github.com/google/skywater-pdk-libs-sky130_fd_pr_reram.git \
            refs/tags/v2.0.3 \
            'refs/tags/v2.0.3^{}'
          curl -fL --retry 5 \
            -o /tmp/adms.tar.gz \
            https://codeload.github.com/Qucs/ADMS/tar.gz/refs/tags/release-2.3.7
          curl -fL --retry 5 \
            -o /tmp/sky130_fd_pr_reram__reram_cell.va \
            https://raw.githubusercontent.com/google/skywater-pdk-libs-sky130_fd_pr_reram/v2.0.3/cells/reram_cell/sky130_fd_pr_reram__reram_cell.va
          sha256sum /tmp/adms.tar.gz /tmp/sky130_fd_pr_reram__reram_cell.va
          tar -tzf /tmp/adms.tar.gz > /tmp/adms-members.txt
          sed -n '1,3p' /tmp/adms-members.txt
          grep -n '^module ' /tmp/sky130_fd_pr_reram__reram_cell.va
