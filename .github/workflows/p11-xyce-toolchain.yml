name: p11-xyce-toolchain

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'p11-xyce-toolchain-2026-08-19'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe runner
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          nproc
          free -h
          python3 --version
